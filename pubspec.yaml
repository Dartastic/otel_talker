name: otel_talker
description: >-
  OpenTelemetry log bridge for package:talker. Mirrors every Talker log,
  error and exception into the OTel logs pipeline while Talker keeps
  rendering its dev-friendly output.
version: 0.1.0
repository: https://github.com/dartastic/otel_talker
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.12
  dartastic_opentelemetry_api: ^1.0.0-rc.1
  talker: ^5.0.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
